<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        .logo p {
            color: #b0b0b0;
            font-size: 1.1em;
            margin-top: 5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .url-input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
            outline: none;
        }

        .url-input::placeholder {
            color: #888;
        }

        .url-input:focus {
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .download-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
            background: linear-gradient(45deg, #ff5252, #ff6b6b);
        }

        .download-btn:active {
            transform: translateY(-1px);
        }

        .platforms {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .platform-btn {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .platform-btn:hover,
        .platform-btn.active {
            background: #4ecdc4;
            border-color: #4ecdc4;
            color: #000;
            transform: translateY(-2px);
        }

        .format-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .format-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .format-btn:hover,
        .format-btn.active {
            background: #45b7d1;
            border-color: #45b7d1;
            transform: translateY(-2px);
        }

        .quality-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .quality-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            min-width: 80px;
        }

        .quality-btn:hover,
        .quality-btn.active {
            background: #ff8e8e;
            border-color: #ff8e8e;
            transform: translateY(-2px);
        }

        .progress {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #45b7d1);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .result {
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
        }

        .success {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid #4ecdc4;
        }

        .error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .download-link {
            display: inline-block;
            padding: 12px 20px;
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .download-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(78, 205, 196, 0.4);
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .logo h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📹 Downloader</h1>
            <p>Download Video & Audio dari YouTube, Facebook, X.com</p>
        </div>

        <div class="platforms">
            <button class="platform-btn active" data-platform="youtube">YouTube</button>
            <button class="platform-btn" data-platform="facebook">Facebook</button>
            <button class="platform-btn" data-platform="x">X.com</button>
        </div>

        <div class="input-group">
            <input type="url" class="url-input" id="videoUrl" placeholder="Masukkan URL video... (Ctrl+V)">
        </div>

        <div class="format-group">
            <button class="format-btn active" data-format="mp4">MP4</button>
            <button class="format-btn" data-format="mp3">MP3</button>
        </div>

        <div class="quality-group" id="qualityGroup">
            <button class="quality-btn active" data-quality="720p">720p</button>
            <button class="quality-btn" data-quality="1080p">1080p</button>
            <button class="quality-btn" data-quality="4k">4K</button>
        </div>

        <button class="download-btn" onclick="downloadVideo()">
            🚀 Download Sekarang
        </button>

        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        // Platform selection
        document.querySelectorAll('.platform-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Format selection
        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateQualityOptions(btn.dataset.format);
            });
        });

        // Quality selection
        document.querySelectorAll('.quality-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        function updateQualityOptions(format) {
            const qualityGroup = document.getElementById('qualityGroup');
            if (format === 'mp4') {
                qualityGroup.innerHTML = `
                    <button class="quality-btn active" data-quality="720p">720p</button>
                    <button class="quality-btn" data-quality="1080p">1080p</button>
                    <button class="quality-btn" data-quality="4k">4K</button>
                `;
            } else if (format === 'mp3') {
                qualityGroup.innerHTML = `
                    <button class="quality-btn active" data-quality="128kbps">128kbps</button>
                    <button class="quality-btn" data-quality="320kbps">320kbps</button>
                `;
            }
            // Re-attach event listeners
            document.querySelectorAll('.quality-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        }

        // Simulate download process
        function downloadVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url) {
                showResult('Masukkan URL video terlebih dahulu!', 'error');
                return;
            }

            // Validate URL
            if (!isValidUrl(url)) {
                showResult('URL tidak valid! Pastikan URL dari YouTube, Facebook, atau X.com', 'error');
                return;
            }

            // Show progress
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            const result = document.getElementById('result');
            
            progress.style.display = 'block';
            result.style.display = 'none';

            // Simulate processing
            let progressValue = 0;
            const interval = setInterval(() => {
                progressValue += Math.random() * 15;
                if (progressValue > 90) progressValue = 90;
                progressBar.style.width = progressValue + '%';
            }, 200);

            // Simulate API call
            setTimeout(() => {
                clearInterval(interval);
                progressBar.style.width = '100%';
                
                setTimeout(() => {
                    progress.style.display = 'none';
                    showDownloadLinks(url);
                }, 500);
            }, 3000);
        }

        function showResult(message, type) {
            const result = document.getElementById('result');
            result.className = `result ${type}`;
            result.innerHTML = `<p>${message}</p>`;
            result.style.display = 'block';
        }

        function showDownloadLinks(url) {
            const format = document.querySelector('.format-btn.active').dataset.format;
            const platform = document.querySelector('.platform-btn.active').dataset.platform;
            const quality = document.querySelector('.quality-btn.active').dataset.quality;
            
            const result = document.getElementById('result');
            result.className = 'result success';
            result.innerHTML = `
                <h3>✅ Siap Download!</h3>
                <p>Video berhasil diproses dari ${platform.toUpperCase()}</p>
                <div class="download-links">
                    <a href="#" class="download-link" onclick="downloadFile('video_${format}_${quality}_${Date.now()}.${format}')">
                        📥 Download ${format.toUpperCase()} (${quality})
                    </a>
                    <a href="#" class="download-link" onclick="copyLink()">
                        🔗 Salin Link Download
                    </a>
                </div>
            `;
            result.style.display = 'block';
        }

        function downloadFile(filename) {
            // Create fake download
            const link = document.createElement('a');
            link.href = '#';
            link.download = filename;
            link.click();
            
            showResult('File berhasil diunduh! Cek folder Downloads Anda.', 'success');
        }

        function copyLink() {
            // Copy to clipboard simulation
            navigator.clipboard.writeText('https://example.com/download.mp4').then(() => {
                showResult('Link berhasil disalin ke clipboard!', 'success');
            });
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return ['youtube.com', 'youtu.be', 'facebook.com', 'x.com', 'twitter.com'].some(domain => 
                    url.hostname.includes(domain)
                );
            } catch {
                return false;
            }
        }

        // Auto-focus input
        document.getElementById('videoUrl').focus();

        // Paste detection
        document.addEventListener('paste', (e) => {
            setTimeout(() => {
                const url = document.getElementById('videoUrl').value.trim();
                if (isValidUrl(url)) {
                    document.querySelector('.download-btn').textContent = '✅ URL Terdeteksi! Klik Download';
                }
            }, 100);
        });
    </script>
</body>
</html>
